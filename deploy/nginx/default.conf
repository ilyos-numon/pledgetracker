# Static SPA server for the Vite build (web/dist copied to /usr/share/nginx/html).
# Image: nginxinc/nginx-unprivileged (uid 101, non-root), so it listens on 8080.
# Health check endpoint: /health (Cloud Run does not pass /healthz to the app).
# add_header in a location replaces the server-level ones, so nosniff is repeated there.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    location = /health {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        return 200 '{"ok":true}';
    }

    # Hashed build assets: cache forever, never fall back to index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # The SPA shell must always be revalidated so new deploys show up.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    # Client-side routes: serve the file if it exists, otherwise the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
