# 로컬 Supabase 설정. 포트 대역 58320-58383 (docs/ports.md 에 등록)
project_id = "pledgetracker"

[api]
enabled = true
port = 58321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 58322
shadow_port = 58320
major_version = 17

[db.pooler]
enabled = false
port = 58329

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 58323
api_url = "http://localhost"

[local_smtp]
enabled = true
port = 58324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:8860"
additional_redirect_urls = ["http://localhost:*"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = false
inspector_port = 58383

[analytics]
enabled = false
port = 58327
backend = "postgres"
